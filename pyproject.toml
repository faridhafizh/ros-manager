[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ros-manager"
version = "0.1.0"
description = "RouterOS fleet manager CLI: health checks, doctor, backups, restore, diff, notifications, and dashboard"
requires-python = ">=3.11"
authors = [
    { name = "farid" },
]
dependencies = [
    "typer>=0.15,<1",
    "PyYAML>=6.0",
    "librouteros>=4.2,<5",
    "paramiko>=3.4,<4",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
rosm = "ros_manager.cli:app"

[tool.hatch.build]
packages = ["src/ros_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
