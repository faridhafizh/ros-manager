# Example inventory for ROS Manager (`rosm`).
#
# Copy this file, fill in your routers, and export the password environment
# variables before running any command. Passwords are NEVER stored here.
#
#   export R1_PASS='...'
#   export R2_PASS='...'
#   rosm check --config inventory.yaml

backup_dir: backups

# Optional: keep only the newest N backups per router (default: keep all).
retention:
  keep_last: 14

# Optional: split the inventory across files. Paths are relative to this file,
# globs are expanded, includes may recurse, and cycles are rejected.
# include:
#   - routers/core/*.yaml
#   - routers/edge.yaml

routers:
  - name: core-1
    host: 192.168.88.1
    username: admin
    password_env: R1_PASS
    # Optional groups used by `--group` filters.
    groups: [core, backbone]
    # RouterOS API-SSL (default port 8729, TLS validated by default).
    api_port: 8729
    api_tls: true
    # Optional private CA used to validate the router's API certificate.
    # api_ca_file: /etc/ssl/certs/router-ca.pem
    ssh_port: 22
    ssh_known_hosts: ~/.ssh/known_hosts

  - name: edge-1
    host: 192.168.89.1
    username: admin
    password_env: R2_PASS
    groups: [edge]
    # Plain API is only used when explicitly requested (default port 8728).
    api_tls: false
    api_port: 8728
    ssh_port: 22
    ssh_known_hosts: ~/.ssh/known_hosts
    # Per-router override of the global retention policy.
    retention:
      keep_last: 30

# Optional: notifications. Telegram and/or a generic webhook.
# Alerts are sent only when a router changes status (flap detection); use
# `rosm run --notify-all` to force a full summary.
# notifications:
#   telegram:
#     token_env: TELEGRAM_BOT_TOKEN
#     chat_id: "123456789"
#   webhook:
#     url_env: HOOK_URL
#     style: generic   # generic | slack | discord
#
# state_file: .rosm_state.json
